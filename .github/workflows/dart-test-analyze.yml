name: DigiCoinLib 0.0.3 validation

on:
  push:
    branches: [master, release/digicoinlib-0.0.3]
  pull_request:
    branches: [master]

jobs:
  dart:
    name: Dart analyzer and Chrome/WASM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: browser-actions/setup-chrome@v1
      - name: Install Dart dependencies
        working-directory: digicoinlib
        run: dart pub get
      - name: Analyze Dart library
        working-directory: digicoinlib
        run: dart analyze --no-fatal-infos
      - name: Run Dart Chrome tests
        working-directory: digicoinlib
        run: dart test -p chrome

  flutter:
    name: Flutter plugin and example analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Local unpublished Dart core override
        working-directory: digicoinlib_flutter
        run: |
          printf 'dependency_overrides:\n  digicoinlib:\n    path: ../digicoinlib\n' > pubspec_overrides.yaml
      - name: Analyze Flutter wrapper
        working-directory: digicoinlib_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Local example overrides
        working-directory: digicoinlib_flutter/example
        run: |
          printf 'dependency_overrides:\n  digicoinlib:\n    path: ../../digicoinlib\n  digicoinlib_flutter:\n    path: ..\n' > pubspec_overrides.yaml
      - name: Analyze Flutter example
        working-directory: digicoinlib_flutter/example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
